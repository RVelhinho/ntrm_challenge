---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/nutritionists/{nutritionist_id}/appointment_requests":
    get:
      summary: List pending requests for a nutritionist
      tags:
      - Appointment Requests
      parameters:
      - name: nutritionist_id
        in: path
        required: true
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      responses:
        '200':
          description: pending requests
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - meta
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - guest
                      - nutritionist_id
                      - service
                      - starts_at
                      - ends_at
                      - status
                      - answered_at
                      properties:
                        id:
                          type: integer
                        guest:
                          type: object
                          required:
                          - id
                          - name
                          - email
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            email:
                              type: string
                              format: email
                        nutritionist_id:
                          type: integer
                        service:
                          type: object
                          required:
                          - id
                          - name
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                        starts_at:
                          type: string
                          format: date_time
                        ends_at:
                          type: string
                          format: date_time
                        status:
                          type: string
                          enum:
                          - pending
                          - accepted
                          - rejected
                          - superseded
                        answered_at:
                          type: string
                          format: date_time
                          nullable: true
                  meta:
                    type: object
                    required:
                    - page
                    - per_page
                    - total_count
                    - total_pages
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
                      total_pages:
                        type: integer
  "/api/v1/appointment_requests":
    post:
      summary: Create an appointment request
      tags:
      - Appointment Requests
      parameters: []
      responses:
        '201':
          description: created appointment request
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - guest
                - nutritionist_id
                - service
                - starts_at
                - ends_at
                - status
                - answered_at
                properties:
                  id:
                    type: integer
                  guest:
                    type: object
                    required:
                    - id
                    - name
                    - email
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                  nutritionist_id:
                    type: integer
                  service:
                    type: object
                    required:
                    - id
                    - name
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  starts_at:
                    type: string
                    format: date_time
                  ends_at:
                    type: string
                    format: date_time
                  status:
                    type: string
                    enum:
                    - pending
                    - accepted
                    - rejected
                    - superseded
                  answered_at:
                    type: string
                    format: date_time
                    nullable: true
        '422':
          description: invalid appointment request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        additionalProperties: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - guest_name
              - guest_email
              - service_id
              - starts_at
              properties:
                guest_name:
                  type: string
                guest_email:
                  type: string
                  format: email
                service_id:
                  type: integer
                starts_at:
                  type: string
                  format: date_time
        required: true
  "/api/v1/appointment_requests/{id}/accept":
    patch:
      summary: Accept an appointment request
      tags:
      - Appointment Requests
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: accepted request
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - guest
                - nutritionist_id
                - service
                - starts_at
                - ends_at
                - status
                - answered_at
                properties:
                  id:
                    type: integer
                  guest:
                    type: object
                    required:
                    - id
                    - name
                    - email
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                  nutritionist_id:
                    type: integer
                  service:
                    type: object
                    required:
                    - id
                    - name
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  starts_at:
                    type: string
                    format: date_time
                  ends_at:
                    type: string
                    format: date_time
                  status:
                    type: string
                    enum:
                    - pending
                    - accepted
                    - rejected
                    - superseded
                  answered_at:
                    type: string
                    format: date_time
                    nullable: true
  "/api/v1/appointment_requests/{id}/reject":
    patch:
      summary: Reject an appointment request
      tags:
      - Appointment Requests
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: rejected request
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - guest
                - nutritionist_id
                - service
                - starts_at
                - ends_at
                - status
                - answered_at
                properties:
                  id:
                    type: integer
                  guest:
                    type: object
                    required:
                    - id
                    - name
                    - email
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                  nutritionist_id:
                    type: integer
                  service:
                    type: object
                    required:
                    - id
                    - name
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  starts_at:
                    type: string
                    format: date_time
                  ends_at:
                    type: string
                    format: date_time
                  status:
                    type: string
                    enum:
                    - pending
                    - accepted
                    - rejected
                    - superseded
                  answered_at:
                    type: string
                    format: date_time
                    nullable: true
  "/api/v1/nutritionists":
    get:
      summary: Search nutritionists and services
      tags:
      - Nutritionists
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: location
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: latitude
        in: query
        required: false
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: longitude
        in: query
        required: false
        schema:
          type: number
          minimum: -180
          maximum: 180
      responses:
        '200':
          description: orders by nearest coordinates
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - meta
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - services
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        biography:
                          type: string
                          nullable: true
                        distance_km:
                          type: number
                          nullable: true
                        services:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - name
                            - price_cents
                            - duration_minutes
                            - location
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              price_cents:
                                type: integer
                              duration_minutes:
                                type: integer
                              location:
                                type: string
                              latitude:
                                type: number
                                nullable: true
                              longitude:
                                type: number
                                nullable: true
                  meta:
                    type: object
                    required:
                    - page
                    - per_page
                    - total_count
                    - total_pages
                    - location
                    - location_mode
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
                      total_pages:
                        type: integer
                      location:
                        type: string
                        nullable: true
                      location_mode:
                        type: string
                        enum:
                        - all
                        - exact
                        - nearest
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
