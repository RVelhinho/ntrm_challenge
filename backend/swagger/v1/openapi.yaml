---
openapi: 3.0.1
info:
  title: Nutrium Appointment Requests API
  description: Search nutritionists and manage guest appointment requests.
  version: v1
  license:
    name: MIT
    url: https://opensource.org/license/mit
paths:
  "/api/v1/appointment_requests":
    get:
      summary: List appointment requests across all nutritionists
      tags:
      - Appointment Requests
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - accepted
          - rejected
          - superseded
          - all
          default: pending
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: appointment request page
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - page_info
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - guest
                      - nutritionist
                      - service
                      - starts_at
                      - ends_at
                      - status
                      - answered_at
                      properties:
                        id:
                          type: integer
                        guest:
                          type: object
                          required:
                          - id
                          - name
                          - email
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            email:
                              type: string
                              format: email
                        nutritionist:
                          type: object
                          required:
                          - id
                          - name
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                        service:
                          type: object
                          required:
                          - id
                          - name
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                        starts_at:
                          type: string
                          format: date-time
                        ends_at:
                          type: string
                          format: date-time
                        status:
                          type: string
                          enum:
                          - pending
                          - accepted
                          - rejected
                          - superseded
                        answered_at:
                          type: string
                          format: date-time
                          nullable: true
                  page_info:
                    type: object
                    required:
                    - page_size
                    - has_next_page
                    - has_previous_page
                    - next_cursor
                    properties:
                      page_size:
                        type: integer
                      has_next_page:
                        type: boolean
                      has_previous_page:
                        type: boolean
                      next_cursor:
                        type: string
                        nullable: true
        '400':
          description: invalid cursor
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        additionalProperties: true
    post:
      summary: Create an appointment request
      tags:
      - Appointment Requests
      parameters: []
      responses:
        '201':
          description: created appointment request
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - guest
                - nutritionist
                - service
                - starts_at
                - ends_at
                - status
                - answered_at
                properties:
                  id:
                    type: integer
                  guest:
                    type: object
                    required:
                    - id
                    - name
                    - email
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                  nutritionist:
                    type: object
                    required:
                    - id
                    - name
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  service:
                    type: object
                    required:
                    - id
                    - name
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  starts_at:
                    type: string
                    format: date-time
                  ends_at:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum:
                    - pending
                    - accepted
                    - rejected
                    - superseded
                  answered_at:
                    type: string
                    format: date-time
                    nullable: true
        '409':
          description: time overlaps an accepted appointment
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        additionalProperties: true
        '422':
          description: invalid appointment request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        additionalProperties: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - guest_name
              - guest_email
              - service_id
              - starts_at
              properties:
                guest_name:
                  type: string
                guest_email:
                  type: string
                  format: email
                service_id:
                  type: integer
                starts_at:
                  type: string
                  format: date-time
        required: true
  "/api/v1/appointment_requests/{id}/accept":
    patch:
      summary: Accept an appointment request
      tags:
      - Appointment Requests
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: accepted request
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - guest
                - nutritionist
                - service
                - starts_at
                - ends_at
                - status
                - answered_at
                properties:
                  id:
                    type: integer
                  guest:
                    type: object
                    required:
                    - id
                    - name
                    - email
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                  nutritionist:
                    type: object
                    required:
                    - id
                    - name
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  service:
                    type: object
                    required:
                    - id
                    - name
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  starts_at:
                    type: string
                    format: date-time
                  ends_at:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum:
                    - pending
                    - accepted
                    - rejected
                    - superseded
                  answered_at:
                    type: string
                    format: date-time
                    nullable: true
        '409':
          description: request is not pending
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        additionalProperties: true
  "/api/v1/appointment_requests/{id}/reject":
    patch:
      summary: Reject an appointment request
      tags:
      - Appointment Requests
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: rejected request
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - guest
                - nutritionist
                - service
                - starts_at
                - ends_at
                - status
                - answered_at
                properties:
                  id:
                    type: integer
                  guest:
                    type: object
                    required:
                    - id
                    - name
                    - email
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                  nutritionist:
                    type: object
                    required:
                    - id
                    - name
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  service:
                    type: object
                    required:
                    - id
                    - name
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  starts_at:
                    type: string
                    format: date-time
                  ends_at:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum:
                    - pending
                    - accepted
                    - rejected
                    - superseded
                  answered_at:
                    type: string
                    format: date-time
                    nullable: true
        '409':
          description: request is not pending
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        additionalProperties: true
  "/api/v1/nutritionists":
    get:
      summary: Search nutritionists and services
      tags:
      - Nutritionists
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: location
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: matching nutritionists
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page_info
                - location
                - locations
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - services
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        biography:
                          type: string
                          nullable: true
                        gender:
                          type: string
                          nullable: true
                        services:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - name
                            - price_cents
                            - duration_minutes
                            - location
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              price_cents:
                                type: integer
                              duration_minutes:
                                type: integer
                              location:
                                type: string
                  page_info:
                    type: object
                    required:
                    - current_page
                    - page_size
                    - total_count
                    - total_pages
                    - has_next_page
                    - has_previous_page
                    properties:
                      current_page:
                        type: integer
                      page_size:
                        type: integer
                      total_count:
                        type: integer
                      total_pages:
                        type: integer
                      has_next_page:
                        type: boolean
                      has_previous_page:
                        type: boolean
                  location:
                    type: string
                  locations:
                    type: array
                    items:
                      type: string
servers:
- url: http://localhost:3000
  description: Local development server
